name: Lint Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Ansible
        run: |
          python -m pip install --only-binary=:all: "ansible-core==2.16.14"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run infrastructure regression checks
        run: python -m unittest discover -s tests -v
      - name: Check bootstrap playbook syntax
        working-directory: ansible/bootstrap
        run: |
          for inventory in inventory/hosts.yml inventory/hosts-newton.yml; do
            ansible-playbook playbooks/tailscale.yml -i "$inventory" --syntax-check
          done
      - name: Check configure playbook syntax
        working-directory: ansible/github
        run: |
          for inventory in inventory/hosts.yml inventory/hosts-newton.yml; do
            ansible-playbook playbooks/site.yml -i "$inventory" --syntax-check
          done

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: docker-compose-linter/dclint-github-action@v1.6.0
        with:
          max-warnings: 0

  sonar:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  kics:
    runs-on: ubuntu-latest
    name: kics-action
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Mkdir results-dir
        run: mkdir -p results-dir
      - name: Run KICS Scan with SARIF result
        uses: checkmarx/kics-github-action@v2.1.19
        with:
          path: 'docker-compose.yaml,docker-compose.newton.yaml'
          ignore_on_exit: results
          output_path: results-dir
          output_formats: 'json,sarif'
      - name: Show results
        run: |
          cat results-dir/results.sarif
          cat results-dir/results.json
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-dir/results.sarif
