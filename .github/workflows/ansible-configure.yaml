name: Ansible Configure

# One-button full host configuration, run after the (one-time, LAN-only) Tailscale
# bootstrap. Installs/updates everything: OS packages, Docker, Samba, the "github" deploy
# user, and the Docker stack itself. Safe to re-run any time — every role is idempotent.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to configure'
        required: true
        type: choice
        options:
          - chris
          - jack
          - newton
        default: chris
      branch:
        description: 'home-server / home-server-configuration / private-home-server branch to deploy'
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          missing=()
          [ -z "${{ vars.TAILSCALE_TARGET_HOST }}" ] && missing+=("vars.TAILSCALE_TARGET_HOST")
          [ -z "${{ vars.ADMIN_SSH_USER }}" ] && missing+=("vars.ADMIN_SSH_USER")
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("secrets.SSH_PRIVATE_KEY")
          [ -z "$ANSIBLE_BECOME_PASSWORD" ] && missing+=("secrets.ANSIBLE_BECOME_PASSWORD")
          [ -z "$ANSIBLE_VAULT_PASSWORD" ] && missing+=("secrets.ANSIBLE_VAULT_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required environment configuration for '${{ inputs.environment }}': ${missing[*]}"
            echo "Set 'vars.*' entries under the Variables tab (not Secrets) and 'secrets.*' entries under the Secrets tab, both in Settings > Environments > ${{ inputs.environment }}."
            exit 1
          fi

      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAG }}
          ping: ${{ vars.TAILSCALE_TARGET_HOST }}

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade "pip==24.3.1"
          python3 -m pip install "ansible-core==2.16.14"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 -D /dev/null "${RUNNER_TEMP}/ssh_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "${RUNNER_TEMP}/ssh_key"

      - name: Write vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          install -m 600 -D /dev/null "${RUNNER_TEMP}/vault_pass"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "${RUNNER_TEMP}/vault_pass"

      - name: Run site.yml
        working-directory: ansible/github
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
        run: |
          ansible-playbook playbooks/site.yml \
            -e ansible_host="${{ vars.TAILSCALE_TARGET_HOST }}" \
            -e ansible_user="${{ vars.ADMIN_SSH_USER }}" \
            -e ansible_ssh_private_key_file="${RUNNER_TEMP}/ssh_key" \
            -e ansible_become_password="$ANSIBLE_BECOME_PASSWORD" \
            -e deploy_branch="${{ inputs.branch || 'main' }}" \
            --vault-password-file "${RUNNER_TEMP}/vault_pass"
