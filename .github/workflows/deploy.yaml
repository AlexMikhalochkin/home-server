name: Deploy

# Fast path: pull the latest code and restart the Docker stack. No OS/package/Samba/deploy-
# user setup here (that's "Ansible Configure") — just clone + `docker compose up`, reusing
# the exact same docker_stack Ansible tasks (tag: deploy) so there's one implementation of
# "start the stack", not two to keep in sync. Runs as the restricted "github" deploy user —
# no admin/sudo/vault credentials needed, since none of the deploy-tagged tasks touch them.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - chris
          - jack
          - newton
        default: chris
      branch:
        description: 'Branch to deploy (optional)'
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAG }}
          ping: ${{ vars.TAILSCALE_TARGET_HOST }}

      - name: Install Ansible
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible-core>=2.16"

      - name: Write SSH private key
        run: |
          install -m 600 -D /dev/null "${RUNNER_TEMP}/ssh_key"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "${RUNNER_TEMP}/ssh_key"

      - name: Deploy stack (git pull + docker compose up)
        working-directory: ansible/github
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook playbooks/site.yml \
            --tags deploy \
            -e ansible_host="${{ vars.TAILSCALE_TARGET_HOST }}" \
            -e ansible_user="${{ vars.SSH_USER }}" \
            -e ansible_ssh_private_key_file="${RUNNER_TEMP}/ssh_key" \
            -e deploy_branch="${{ inputs.branch || 'main' }}"
