api:
  dashboard: true
  # insecure: true is intentional for LAN-only access
  # Keep direct dashboard access on host port 8082 during the hostname transition.
  # For production/public deployments, implement proper authentication
  insecure: true

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus: {}
