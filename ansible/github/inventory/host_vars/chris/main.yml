---
# Non-secret configuration for the chris Docker stack

docker_compose_profile: chris
deploy_user: github
deploy_branch: main

timezone: Europe/Berlin

# Home Assistant and Jellyfin run independently of the optional VPN. Re-enable this
# when VPN credentials are available and a routed VPN design is in place.
vpn_enabled: false

docker_users:
  - github
  - alex

# Public half of the GitHub Actions deploy keypair (private half is the SSH_PRIVATE_KEY
# GitHub Actions secret on the chris environment). Generate with:
#   ssh-keygen -t ed25519 -f gh_actions_chris -N ""
github_ci_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICkxEh2AMyiTtG61MB2qz7tm/+FLGiOKzD2cFkwzKqxg gh-actions-chris"

samba_enabled: true
samba_shares:
  - name: downloads
    path: "{{ service_paths.downloads }}"
    comment: qBittorrent downloads
  - name: tv-series
    path: "{{ service_paths.tv_series }}"
    comment: TV series
  - name: movies
    path: "{{ service_paths.movies }}"
    comment: Movies
samba_user: alex
samba_create_user: false

# External disks are optional. Add entries here when disks are attached, then point only
# the services that should use them at their mount-point paths below.
storage_disks: []

# Example for the existing 1 TB media disk:
# storage_disks:
#   - name: media
#     source: /dev/disk/by-uuid/b64016e5-92cb-40a8-93c9-a2bc59893cf1
#     mount_point: /media/media
#     fstype: ext4
#     format: false

service_paths:
  content: /opt/github-deploy/storage/content
  tv_series: /opt/github-deploy/storage/content/tv-series
  movies: /opt/github-deploy/storage/content/movies
  downloads: /opt/github-deploy/storage/downloads

# zigbee2mqtt needs its USB Zigbee coordinator (/dev/ttyUSB0) physically moved from the old
# server too. Flip to true once it's plugged into this host, then re-run site.yml — until
# then it's simply not part of the stack (its own compose profile, not started with `chris`).
zigbee_enabled: true

stack_env:
  HOME_ASSISTANT_CONFIGURATION_DIRECTORY: /opt/github-deploy/homeassistant/config
  PLEX_CONFIG_DIRECTORY: /opt/github-deploy/plex
  PLEX_CONTENT_DIRECTORY: "{{ service_paths.content }}"
  PLEX_MEDIA_PATH: "{{ service_paths.content }}"
  QBITTORRENT_MEDIA_PATH: "{{ service_paths.downloads }}"
  QBITTORRENT_DOWNLOADS_PATH: "{{ service_paths.downloads }}"
  QBITTORRENT_INCOMPLETE_PATH: "{{ service_paths.downloads }}/incomplete"
  TIMEZONE: Europe/Berlin
  HOST_IP: "0.0.0.0"
