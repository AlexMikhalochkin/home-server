---
# Non-secret configuration for the chris Docker stack

docker_compose_profile: chris
deploy_user: github
deploy_branch: main
media_access_enabled: true
media_group: media
docker_stack_start_script_path: "{{ deploy_base_dir }}/start.sh"
docker_compose_files:
  - "{{ home_server_dir }}/docker-compose.yaml"
  - "{{ private_home_server_dir }}/docker-compose.yaml"
  - "{{ deploy_base_dir }}/media-compose.yaml"

timezone: Europe/Berlin

docker_users:
  - github
  - alex

# Public half of the GitHub Actions deploy keypair (private half is the SSH_PRIVATE_KEY
# GitHub Actions secret on the chris environment). Generate with:
#   ssh-keygen -t ed25519 -f gh_actions_chris -N ""
github_ci_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICkxEh2AMyiTtG61MB2qz7tm/+FLGiOKzD2cFkwzKqxg gh-actions-chris"

samba_enabled: true
samba_shares:
  - name: downloads
    path: "{{ service_paths.downloads }}"
    comment: qBittorrent downloads
  - name: media2
    path: "{{ service_paths.media2 }}"
    comment: Additional media storage
  - name: tv-series
    path: "{{ service_paths.tv_series }}"
    comment: TV series
  - name: movies
    path: "{{ service_paths.movies }}"
    comment: Movies
samba_user: alex
samba_create_user: false

# The existing 1 TB disk is a MergerFS branch; /mnt/media remains the services' pool path.
storage_disks:
  - name: media
    source: /dev/disk/by-uuid/b64016e5-92cb-40a8-93c9-a2bc59893cf1
    mount_point: /mnt/disks/media1
    legacy_mount_point: /mnt/media
    fstype: ext4
    mount_opts: defaults,nofail,x-systemd.device-timeout=10s
    format: false
  - name: media2
    source: /dev/disk/by-uuid/145866da-9732-4a01-8b29-87ae3efbfb94
    mount_point: /mnt/media2
    fstype: ext4
    mount_opts: defaults,nofail,x-systemd.device-timeout=10s
    format: false

storage_pool:
  mount_point: /mnt/media
  branches:
    - /mnt/disks/media1
    - /mnt/media2
  mount_opts:
    - allow_other
    - use_ino
    - category.create=mfs
    - nofail
    - x-systemd.requires=mnt-disks-media1.mount
    - x-systemd.requires=mnt-media2.mount

# Keep media containers stopped unless the pool mount succeeds during Docker startup.
docker_stack_storage_mount_path: /mnt/media
docker_stack_storage_containers:
  - qbittorrent
  - plex
  - jellyfin

service_paths:
  content: /mnt/media/content
  tv_series: /mnt/media/content/tv-series
  movies: /mnt/media/content/movies
  downloads: /mnt/media/downloads
  media2: /mnt/media2

# zigbee2mqtt needs its USB Zigbee coordinator (/dev/ttyUSB0) physically moved from the old
# server too. Flip to true once it's plugged into this host, then re-run site.yml — until
# then it's simply not part of the stack (its own compose profile, not started with `chris`).
zigbee_enabled: true

stack_env:
  HOME_ASSISTANT_CONFIGURATION_DIRECTORY: /opt/github-deploy/homeassistant/config
  PLEX_CONFIG_DIRECTORY: /opt/github-deploy/plex
  PLEX_CONTENT_DIRECTORY: "{{ service_paths.content }}"
  PLEX_MEDIA_PATH: "{{ service_paths.content }}"
  MEDIA2_PATH: "{{ service_paths.media2 }}"
  QBITTORRENT_ROOT_PATH: /mnt/media
  TIMEZONE: Europe/Berlin
  HOST_IP: "0.0.0.0"

# Nightly restic backup of app state (roles/backup; secrets in ansible/vault/secrets.yml).
# Paths are where state lives today; they move to /srv/appdata in Part 2 of
# docs/superpowers/specs/2026-10-30-app-state-and-backups-design.md.
backup_enabled: true
backup_restic_repository: s3:s3.eu-central-1.amazonaws.com/alex-home-servers-backups/chris
backup_paths:
  - "{{ stack_env.HOME_ASSISTANT_CONFIGURATION_DIRECTORY }}"
  # Still bind-mounted from the configuration checkout and edited by the apps' UIs.
  - /opt/github-deploy/home-server-configuration/home-assistant
  - /opt/github-deploy/home-server-configuration/zigbee2mqtt
  - /opt/github-deploy/home-server-configuration/qbittorrent
  - "{{ stack_env.PLEX_CONFIG_DIRECTORY }}/config"
  - /var/lib/docker/volumes/home-server_grafana-data/_data
  - /var/lib/docker/volumes/home-server_jellyfin-config/_data
  - /var/lib/docker/volumes/home-server_qbittorrent-data/_data
  - /var/lib/docker/volumes/home-server_jackett-data/_data
# Rebuildable caches, artwork, logs and redundant app-native backups.
backup_excludes:
  - "{{ backup_plex_dir }}/Cache"
  - "{{ backup_plex_dir }}/Media"
  - "{{ backup_plex_dir }}/Metadata"
  - "{{ backup_plex_dir }}/Codecs"
  - "{{ backup_plex_dir }}/Drivers"
  - "{{ backup_plex_dir }}/Logs"
  - "{{ backup_plex_dir }}/Crash Reports"
  - /var/lib/docker/volumes/home-server_jellyfin-config/_data/metadata
  - /var/lib/docker/volumes/home-server_jellyfin-config/_data/log
  - /opt/github-deploy/home-server-configuration/zigbee2mqtt/log
  - "{{ stack_env.HOME_ASSISTANT_CONFIGURATION_DIRECTORY }}/home-assistant.log*"
  - "{{ stack_env.HOME_ASSISTANT_CONFIGURATION_DIRECTORY }}/backups"
backup_plex_dir: "{{ stack_env.PLEX_CONFIG_DIRECTORY }}/config/Library/Application Support/Plex Media Server"
backup_quiesce_containers:
  - home-assistant
  - zigbee2mqtt
  - plex
  - jellyfin
  - qbittorrent
  - jackett
  - grafana
