---
- name: Validate configuration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Require ansible_host (IP address) for each target host
      ansible.builtin.assert:
        that:
          - hostvars[item].ansible_host is defined
          - hostvars[item].ansible_host | length > 0
          - hostvars[item].ansible_host != item
        fail_msg: >-
          ansible_host is not set for '{{ item }}'.
          Pass -e ansible_host=100.x.x.x or create inventory/host_vars/{{ item }}/local.yml.
      loop: "{{ groups['home_servers'] | default([]) }}"

- name: Configure home server for Docker stack
  hosts: home_servers
  gather_facts: false
  become: true

  pre_tasks:
    # Explicit, non-privileged fact gathering: the fast "deploy" path connects as the
    # restricted github deploy user (no sudo at all), and the implicit gather_facts step
    # otherwise inherits the play's become: true (root), which fails for that user. tags:
    # always makes sure this still runs under --tags deploy despite being unneeded there.
    - name: Gather facts
      ansible.builtin.setup:
      become: false
      tags: [always]

    - name: Load encrypted secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vault/secrets.yml"
      become: false

  roles:
    - role: common
      tags: [common]
    - role: deploy_user
      tags: [deploy_user]
    - role: docker
      tags: [docker]
    - role: storage
      tags: [storage]
      when: storage_disks | length > 0
    - role: samba
      tags: [samba]
      when: samba_enabled | bool
    - role: docker_stack
      tags: [stack]
