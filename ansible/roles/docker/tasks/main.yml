---
- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-buildx-plugin']
              + (['docker-compose-plugin'] if docker_install_compose_plugin else []) }}"
    state: present
    update_cache: true
  notify: Restart docker

- name: Configure Docker daemon log rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'log-driver': 'json-file',
                  'log-opts': {'max-size': docker_log_max_size | string,
                               'max-file': docker_log_max_file | string}}
                 | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart docker

# Restart before docker_stack runs so `compose up` starts any containers the restart stopped.
- name: Apply pending Docker daemon restart
  ansible.builtin.meta: flush_handlers

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
