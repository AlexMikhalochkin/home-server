---
- name: Install Samba
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
    update_cache: true

- name: Create media group
  ansible.builtin.group:
    name: "{{ samba_user }}"
    gid: "{{ samba_user_gid }}"
  when: samba_create_user

- name: Create Samba user account
  ansible.builtin.user:
    name: "{{ samba_user }}"
    uid: "{{ samba_user_uid }}"
    group: "{{ samba_user }}"
    create_home: false
    shell: /usr/sbin/nologin
  when: samba_create_user

- name: Create Samba share directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ samba_user_uid }}"
    group: "{{ samba_user_gid }}"
    mode: "0775"
  loop: "{{ samba_shares }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0640"
  notify: Restart samba

- name: Set Samba user password
  ansible.builtin.command:
    argv:
      - smbpasswd
      - -a
      - -s
      - "{{ samba_user }}"
    stdin: "{{ samba_password }}\n{{ samba_password }}"
  no_log: true
  when:
    - samba_password is defined
    - samba_password | length > 0
  changed_when: true

- name: Enable and start Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smbd
    - nmbd
