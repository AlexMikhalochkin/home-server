---
- name: Require GitHub deploy key for private configuration repository
  ansible.builtin.assert:
    that:
      - github_clone_ssh_key_home_server_configuration is defined
      - github_clone_ssh_key_home_server_configuration | length > 0
    fail_msg: >-
      home-server-configuration is private. Add github_clone_ssh_key_home_server_configuration
      to ansible/vault/secrets.yml (a read-only deploy key).
  when: home_server_configuration_enabled | bool
  tags: [prepare]

- name: Require GitHub deploy key for private service repository
  ansible.builtin.assert:
    that:
      - github_clone_ssh_key_private_home_server is defined
      - github_clone_ssh_key_private_home_server | length > 0
    fail_msg: >-
      private-home-server is private. Add github_clone_ssh_key_private_home_server
      to ansible/vault/secrets.yml (a read-only deploy key).
  when: private_home_server_enabled | bool
  tags: [prepare]

- name: Create deploy base directory
  ansible.builtin.file:
    path: "{{ deploy_base_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"
  tags: [prepare]

- name: Ensure deploy user .ssh directory exists
  ansible.builtin.file:
    path: "{{ deploy_base_dir }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  tags: [prepare]

- name: Install GitHub deploy SSH keys
  ansible.builtin.copy:
    content: "{{ item.key }}\n"
    dest: "{{ deploy_base_dir }}/.ssh/{{ item.file }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  loop:
    - file: id_ed25519_home_server_configuration
      key: "{{ github_clone_ssh_key_home_server_configuration }}"
      enabled: "{{ home_server_configuration_enabled }}"
    - file: id_ed25519_private_home_server
      key: "{{ github_clone_ssh_key_private_home_server }}"
      enabled: "{{ private_home_server_enabled }}"
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  when: item.enabled | bool
  tags: [prepare]

- name: Configure SSH host aliases for the GitHub deploy keys
  ansible.builtin.blockinfile:
    path: "{{ deploy_base_dir }}/.ssh/config"
    create: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED github deploy keys"
    block: |
      Host {{ home_server_configuration_ssh_host_alias }}
        HostName github.com
        User git
        IdentityFile {{ deploy_base_dir }}/.ssh/id_ed25519_home_server_configuration
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new

      Host {{ private_home_server_ssh_host_alias }}
        HostName github.com
        User git
        IdentityFile {{ deploy_base_dir }}/.ssh/id_ed25519_private_home_server
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new
  when: home_server_configuration_enabled | bool or private_home_server_enabled | bool
  tags: [prepare]

- name: Clone or update home-server repository (public, HTTPS)
  ansible.builtin.git:
    repo: "{{ home_server_repo }}"
    dest: "{{ home_server_dir }}"
    version: "{{ deploy_branch }}"
    update: true
    # Containers can write into bind-mounted files under these checkouts (zigbee2mqtt,
    # matterbridge, home-assistant config). force=true discards those local modifications
    # before pulling, matching the old start.sh script's explicit `git restore .` step.
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  tags: [deploy]

# home-server-configuration and private-home-server are usually untouched by a feature
# branch that only changes home-server. Mirror the old start.sh script's fallback: use
# deploy_branch there if it exists, otherwise fall back to main. home-server itself has no
# fallback — deploy_branch must exist there (enforced above by the plain git module).
- name: Check whether deploy_branch exists on home-server-configuration
  ansible.builtin.command: "git ls-remote --exit-code --heads {{ home_server_configuration_repo_ssh }} {{ deploy_branch }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: home_server_configuration_branch_check
  changed_when: false
  failed_when: false
  when: home_server_configuration_enabled | bool
  tags: [deploy]

- name: Clone or update home-server-configuration repository (private)
  ansible.builtin.git:
    repo: "{{ home_server_configuration_repo_ssh }}"
    dest: "{{ home_server_configuration_dir }}"
    version: "{{ deploy_branch if home_server_configuration_branch_check.rc == 0 else 'main' }}"
    accept_hostkey: "{{ git_clone_accept_hostkey }}"
    update: true
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  when: home_server_configuration_enabled | bool
  tags: [deploy]

- name: Check whether deploy_branch exists on private-home-server
  ansible.builtin.command: "git ls-remote --exit-code --heads {{ private_home_server_repo_ssh }} {{ deploy_branch }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: private_home_server_branch_check
  changed_when: false
  failed_when: false
  when: private_home_server_enabled | bool
  tags: [deploy]

- name: Clone or update private-home-server repository (private, adds qbittorrent)
  ansible.builtin.git:
    repo: "{{ private_home_server_repo_ssh }}"
    dest: "{{ private_home_server_dir }}"
    version: "{{ deploy_branch if private_home_server_branch_check.rc == 0 else 'main' }}"
    accept_hostkey: "{{ git_clone_accept_hostkey }}"
    update: true
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  when: private_home_server_enabled | bool
  tags: [deploy]

- name: Create stack data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(deploy_user) }}"
    group: "{{ item.group | default(deploy_user) }}"
    mode: "0755"
    recurse: "{{ item.recurse | default(false) }}"
  loop: "{{ stack_directories }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [prepare]

- name: Render Docker Compose environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ home_server_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  tags: [prepare]

- name: Install deploy start script
  ansible.builtin.template:
    src: start.sh.j2
    dest: "{{ docker_stack_start_script_path }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  tags: [prepare]

- name: Require encrypted Newton Frigate secrets
  ansible.builtin.assert:
    that:
      - newton_frigate_vault is defined
      - newton_frigate_vault.camera1 is defined
      - newton_frigate_vault.camera2 is defined
    fail_msg: >-
      Newton requires ansible/vault/newton-frigate.yml with encrypted RTSP URLs
      for both cameras before full configure.
  when:
    - frigate_config_template | length > 0
    - frigate_config_file | length > 0
  tags: [prepare]

- name: Render Frigate configuration from encrypted secrets
  ansible.builtin.template:
    src: "{{ frigate_config_template }}"
    dest: "{{ frigate_config_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - frigate_config_template | length > 0
    - frigate_config_file | length > 0
  tags: [prepare]

- name: Check for externally supplied Frigate configuration
  ansible.builtin.stat:
    path: "{{ frigate_config_file }}"
  register: frigate_config
  become: false
  when: frigate_config_file is defined
  tags: [deploy]

- name: Require externally supplied Frigate configuration
  ansible.builtin.assert:
    that:
      - frigate_config.stat.exists
      - frigate_config.stat.isreg
    fail_msg: >-
      Frigate requires a configuration at {{ frigate_config_file }}.
      Run full configure to render it from Vault, then rerun deploy.
  become: false
  when: frigate_config_file is defined
  tags: [deploy]

- name: Pull Docker images
  ansible.builtin.command:
    cmd: >-
      docker compose
      {% for compose_file in docker_compose_files %}-f {{ compose_file }} {% endfor %}
      --env-file {{ home_server_dir }}/.env
      {% for profile in docker_compose_all_profiles %}--profile {{ profile }} {% endfor %}
      pull
    chdir: "{{ home_server_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  changed_when: true
  when: docker_compose_pull
  tags: [deploy]

- name: Start Docker stack
  ansible.builtin.command:
    cmd: >-
      docker compose
      {% for compose_file in docker_compose_files %}-f {{ compose_file }} {% endfor %}
      --env-file {{ home_server_dir }}/.env
      {% for profile in docker_compose_profiles %}--profile {{ profile }} {% endfor %}
      up -d --remove-orphans
    chdir: "{{ home_server_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: docker_compose_up_result
  changed_when: docker_compose_up_result.rc == 0
  when: docker_compose_up
  tags: [deploy]

# OpenVPN is optional and independent of the normal stack. Services that need it must
# explicitly opt into a routed design rather than sharing its network namespace.
- name: Start optional VPN service
  ansible.builtin.command:
    cmd: >-
      docker compose
      {% for compose_file in docker_compose_files %}-f {{ compose_file }} {% endfor %}
      --env-file {{ home_server_dir }}/.env
      --profile {{ vpn_profile }}
      up -d --remove-orphans
    chdir: "{{ home_server_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: docker_compose_vpn_up_result
  changed_when: docker_compose_vpn_up_result.rc == 0
  failed_when: false
  when: docker_compose_up and vpn_enabled | bool
  tags: [deploy]

- name: Warn if optional VPN service failed to start
  ansible.builtin.debug:
    msg: >-
      openvpn failed to start (rc={{ docker_compose_vpn_up_result.rc }}).
      This is usually an external VPN provider/account issue, not an Ansible problem — check
      your VPN account status/credentials, then re-run this playbook (or just the 'stack' tag)
      once resolved. Rest of the stack is unaffected. Details: {{ docker_compose_vpn_up_result.stderr }}
  when:
    - docker_compose_up and vpn_enabled | bool
    - docker_compose_vpn_up_result.rc != 0
  tags: [deploy]

- name: Show running containers
  ansible.builtin.command:
    cmd: >-
      docker compose
      {% for compose_file in docker_compose_files %}-f {{ compose_file }} {% endfor %}
      {% for profile in docker_compose_all_profiles %}--profile {{ profile }} {% endfor %}
      ps
    chdir: "{{ home_server_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  register: docker_compose_ps
  changed_when: false
  tags: [deploy]

- name: Docker stack status
  ansible.builtin.debug:
    msg: "{{ docker_compose_ps.stdout_lines }}"
  tags: [deploy]
