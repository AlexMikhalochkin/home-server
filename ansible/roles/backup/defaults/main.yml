---
# Nightly restic backup of app state (see docs/superpowers/specs/2026-10-30-app-state-and-backups-design.md).
backup_enabled: false

# s3:s3.<region>.amazonaws.com/<bucket>/<host>
backup_restic_repository: ""
# Set in ansible/vault/secrets.yml (encrypted).
backup_restic_password: ""
backup_aws_access_key_id: ""
backup_aws_secret_access_key: ""

backup_paths: []
backup_excludes: []
# Stopped for the duration of the snapshot so databases are copied consistently.
backup_quiesce_containers: []

backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

backup_schedule: "*-*-* 04:00:00"
backup_randomized_delay: 10m
backup_check_schedule: "*-*-01 05:00:00"
backup_check_read_data_subset: "5%"

backup_textfile_dir: /var/lib/node-exporter/textfile
backup_state_dir: /var/lib/home-server-backup
